<!doctype html><html><head><meta charset="utf-8"></head><body><div id="article-title">关于公布2026年大学生创新训练计划项目校级立项名单的通知</div><div id="article-info">发布时间：2026年06月05日</div><div class="v_news_content">
<p style="text-align: justify; line-height: 1.75em; margin-bottom: 5px;"><span style="font-size: 18px;">各单位：</span></p><p style="text-align: justify; line-height: 1.75em; margin-bottom: 5px; text-indent: 36px;"><span style="font-size: 18px;">学校于近期组织开展2026年大学生创新训练计划项目申报工作，经形式审查、专家评审，并公示无异议，确定《铁军精神融入大学生理想信念教育的CIPP模型评价体系研究》等180个项目为校级项目立项。各项目指导教师要认真指导项目组开展创新创业训练工作，确保项目按时保质完成。</span></p><p style="text-align: justify; line-height: 1.75em; margin-bottom: 5px;"><br/></p><p style="text-align: right; line-height: 1.75em; margin-bottom: 5px;"><span style="font-size: 18px;">肇庆学院</span></p><p style="text-align: right; line-height: 1.75em; margin-bottom: 5px;"><span style="font-size: 18px;">2026年6月5日</span></p><p style="text-align: right;"><br/></p><p style="text-align: left;"><span style="font-size: 18px;">附件：<span id="7EA00" retain="true"><a href="/system/_content/download.jsp?urltype=news.DownloadAttachUrl&amp;owner=1308047241&amp;wbfileid=F5DAA88BA48795F649B2DE2829EB1D18">肇学院〔2026〕62号关于公布2026年大学生创新训练计划项目校级立项名单的通知.pdf</a></span></span></p><p style="text-align: left;"><span style="font-size: 18px;"></span></p><p style="text-indent: 0"><script>var vsb_pdf_image_data = ["/__local/A/E1/7C/5823FA35C8514BED86BBB81547A_DC675CC6_33B2D.jpg","/__local/5/F0/AF/775EE6B29A5D6040B86CC8345A3_B0F408D7_F9BB.jpg","/__local/1/C2/AB/65E2D726810BFFA305C5BFC294E_32D8CDF7_4539F.jpg","/__local/4/B0/3F/A07ABFEF760D14A4454BBF9E401_C0AC8A4D_4C8F5.jpg","/__local/D/6F/8B/D559A3E2F948B1ACE2B077B91D5_51D01301_4CC0E.jpg","/__local/E/8B/47/22D6D016B4BAC3F1077BA19B7FB_285ADF5A_4A560.jpg","/__local/2/35/64/4F1F2C92F2BE6D80CA269D2834E_D0EBA031_4CC1C.jpg","/__local/0/8D/0D/A9B861AAD09591D4A86E8B0EAC1_914B1FE0_4C8AE.jpg","/__local/5/1A/F6/DBB0B1F705EA27A4CAA9D5108C6_4BC44B00_4A9E8.jpg","/__local/6/7F/53/FB50B1CA5192EE3354158393C1E_68F4EEF4_4A3BD.jpg","/__local/3/02/48/5A5FDEF5350B49380A492B808E6_80FCC5E7_47F70.jpg","/__local/6/0E/D3/7F72A85D1B1781BA86C8C3D3D4A_CA3D5A51_4A807.jpg","/__local/5/5A/4C/68A7F661A80069E3
