name: ZQU official information

on:
  # UTC hourly at :17; Asia/Shanghai also runs every hour at :17.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'cycle: normal sync; acceptance: at most ONE labelled cloud pipeline push'
        type: choice
        options:
          - cycle
          - acceptance
        default: cycle
        required: true
      dry_run:
        description: 'Evaluate and persist without sending Bark (required for first run)'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: zqu-official-info-production
  cancel-in-progress: false

jobs:
  sync:
    # Forks and unconfigured schedules cannot read production secrets or send.
    if: github.repository == 'ericpanrun-commits/touxian' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ZQU_ACTIONS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: zqu-production
    defaults:
      run:
        working-directory: desktop/attention-desk
    env:
      APP_ENV: production
      AUTO_SYNC_ENABLED: 'true'
      PRODUCTION_NOTIFICATION_AUTHORITY: 'true'
      BARK_ENABLED: 'true'
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PRODUCTION_DATABASE_ID: ${{ vars.PRODUCTION_DATABASE_ID }}
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL }}
      BARK_GROUP: ZQU
      ZQU_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'cycle' }}
      NOTIFICATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || (vars.ZQU_NOTIFICATION_DRY_RUN != 'false' && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check required configuration without displaying values
        run: |
          python - <<'PY'
          import os
          if os.environ['ZQU_RUN_MODE'] == 'acceptance' and os.environ['NOTIFICATION_DRY_RUN'] != 'false':
              raise SystemExit('Acceptance requires explicit dry_run=false after the first verified cycle.')
          required = ['SUPABASE_DB_URL', 'PRODUCTION_DATABASE_ID']
          if os.environ['NOTIFICATION_DRY_RUN'] == 'false':
              required += ['BARK_DEVICE_KEY', 'BARK_SERVER_URL']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing configuration names: ' + ', '.join(missing))
          PY
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r server/actions/requirements.lock.txt
      - name: Run one bounded official-information cycle
        run: python -m server.actions.worker
